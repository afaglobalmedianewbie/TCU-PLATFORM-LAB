! ==============================================================================
! TCU-PLATFORM-LAB: OLT ZTE C320 INITIALIZATION
! Hardware: ZTE ZXA10 C320 Chassis (SMXA / GTGO / GTGH)
! Architecture: FTTH GPON Headend
! Date: September 2026
! ==============================================================================

configure terminal

! ------------------------------------------------------------------------------
! 1. SYSTEM IDENTITY & TIME
! ------------------------------------------------------------------------------
hostname OLT-ZTE-TCU

! ------------------------------------------------------------------------------
! 2. VLAN CONFIGURATION
!    VLAN 100 : Management Subnet (10.0.10.2/24)
!    VLAN 200 : Internet PPPoE Pelanggan (Transparent Forwarding)
! ------------------------------------------------------------------------------
vlan 100
 name MANAGEMENT
 exit

vlan 200
 name INTERNET-PPPOE
 exit

! ------------------------------------------------------------------------------
! 3. IN-BAND MANAGEMENT IP ADDRESS
! ------------------------------------------------------------------------------
interface vlan 100
 ip address 10.0.10.2 255.255.255.0
 exit

! Default route menuju Gateway MikroTik CCR
ip route 0.0.0.0 0.0.0.0 10.0.10.1

! ------------------------------------------------------------------------------
! 4. UPLINK TRUNK INTERFACE (Kartu SMXA Slot 1 - Port gei_1/4/1)
!    Sesuaikan jika menggunakan port 10GE (xgei_1/4/1) atau gei_1/4/2
! ------------------------------------------------------------------------------
interface gei_1/4/1
 switchport mode trunk
 switchport trunk vlan 100,200
 negotiation auto
 no shutdown
 exit

! ------------------------------------------------------------------------------
! 5. GPON SYSTEM & GLOBAL SETTINGS
! ------------------------------------------------------------------------------
gpon
 auto-learning enable
 exit

! GPON Profiles: T-CONT (Bandwidth Upstream) & Traffic (Downstream)
gpon
 profile tcont UP-1G type 4 maximum 1000000
 profile traffic DOWN-1G sir 1000000 pir 1000000
 profile traffic UP-1G sir 1000000 pir 1000000
 exit

! ------------------------------------------------------------------------------
! 6. SNMP TELEMETRY & MONITORING SETUP (FOR PC RYZEN 7 BACKEND)
! ------------------------------------------------------------------------------
snmp-server community tcupublic ro
snmp-server host 10.0.10.10 version 2c tcupublic
snmp-server enable trap

! ------------------------------------------------------------------------------
! 7. SECURITY ACCESS-LIST (HARDENING TELNET & SNMP)
!    HANYA IZINKAN IP PC SERVER (10.0.10.10) & ADMIN MNG (10.0.10.0/24)
! ------------------------------------------------------------------------------
acl number 10
 rule 1 permit source 10.0.10.10 0.0.0.0
 rule 2 permit source 10.0.10.1 0.0.0.0
 rule 3 deny source any
 exit

telnet-server acl 10

! ------------------------------------------------------------------------------
! 8. SAVE CONFIGURATION TO FLASH
! ------------------------------------------------------------------------------
write
! Selesai!
